# kube-prometheus-stack 91.5.1 for P04 (spec section 5, M2). P03 installs Prometheus with this
# file: fullnameOverride "kps" yields the kps-prometheus Service its AnalysisTemplate queries.
#   helm install kps prometheus-community/kube-prometheus-stack --version 91.5.1 \
#     -n monitoring --create-namespace -f deploy/observability/kps-values.yaml
# OTLP metrics get job = service.namespace/service.name and instance = service.instance.id.
fullnameOverride: kps

prometheus:
  prometheusSpec:
    enableOTLPReceiver: true            # --web.enable-otlp-receiver: apps push, nothing scrapes them
    enableRemoteWriteReceiver: true     # Tempo's metrics-generator writes span metrics here (M3)
    enableFeatures: [exemplar-storage]  # still a feature flag (native histograms are not, since 3.8)
    exemplars: { maxSize: 100000 }
    tsdb: { outOfOrderTimeWindow: 30m } # several gateway replicas push; batches can arrive late
    otlp:
      # Copied onto every series as labels. Everything else stays on the single target_info
      # series per instance. Each entry is a cardinality decision: never IDs that grow with traffic.
      promoteResourceAttributes: [service.version, deployment.environment.name, k8s.namespace.name, k8s.pod.name, freightline.pod_template_hash]
    retention: 12h                      # spec: 72h; the cloud VM is reclaimed when idle (DEVIATIONS D-02)
    ruleSelectorNilUsesHelmValues: false         # pick up every PrometheusRule (Sloth output, M6)
    serviceMonitorSelectorNilUsesHelmValues: false  # and every ServiceMonitor (the gateway's, M4)
    # Lab sizing (not in the spec): 4 CPU / 15 GB VM, budget < 50k active series.
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 2Gi }

prometheus-node-exporter:
  hostRootFsMount: { enabled: false }   # kind / Docker Desktop reject the shared root mount

alertmanager:
  config:                               # lists replace the chart defaults, so keep "null"
    route:
      receiver: ticket
      group_by: [alertname, service]
      routes:
        - { matchers: ['alertname="Watchdog"'], receiver: "null" }
        - { matchers: ['severity="page"'], receiver: page }
    receivers:
      - name: "null"
      - name: page
        email_configs: [{ to: page@lab.local, from: am@lab.local, smarthost: "mailpit.freightline:1025", require_tls: false }]
      - name: ticket
        email_configs: [{ to: ticket@lab.local, from: am@lab.local, smarthost: "mailpit.freightline:1025", require_tls: false }]
  alertmanagerSpec:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }

grafana:
  # Lab addition: the chart's default admin password is the well-known "prom-operator".
  # Empty means the Grafana chart generates a random one into the kps-grafana Secret.
  adminPassword: ""
  # No phone-home: usage stats and update checks call grafana.com / stats.grafana.org.
  # Cobalt's egress proxy would log (or block) them; the default mode needs no SaaS.
  grafana.ini:
    analytics: { reporting_enabled: false, check_for_updates: false, check_for_plugin_updates: false }
  sidecar:
    datasources:
      exemplarTraceIdDestinations: { datasourceUid: tempo, traceIdLabelName: trace_id }
      # $__rate_interval is derived from this. OTLP pushers send every 15 s
      # (OTEL_METRIC_EXPORT_INTERVAL in the library chart), not the 30 s scrape default.
      defaultDatasourceScrapeInterval: 15s
  additionalDataSources:
    - name: Tempo
      uid: tempo
      type: tempo
      url: http://tempo.monitoring:3200
      jsonData:
        serviceMap: { datasourceUid: prometheus }
        tracesToLogsV2:
          datasourceUid: loki
          filterByTraceID: true
          # M8 game day: without it the span menu offers only "Logs for this trace"; with it, "Logs for this
          # span" narrows to lines carrying that span's span_id (orders logs failed inventory calls inside the
          # HTTP POST client span for exactly this).
          filterBySpanID: true
          spanStartTimeShift: "-5m"
          spanEndTimeShift: "5m"
          tags: [{ key: service.name, value: service_name }]
    - name: Loki
      uid: loki
      type: loki
      url: http://loki.monitoring:3100
      jsonData:
        derivedFields:   # "$$" stops Grafana provisioning from expanding ${__value.raw}
          - { name: trace_id, matcherType: label, matcherRegex: trace_id, datasourceUid: tempo, url: "$${__value.raw}" }

# kind runs etcd, the scheduler, the controller-manager and kube-proxy with metrics bound to
# 127.0.0.1, so these targets are always down and their *Down alerts would fire forever into
# the ticket route. Lab only (DEVIATIONS D-12); a real cluster keeps them.
kubeEtcd: { enabled: false }
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeProxy: { enabled: false }

# Cardinality (NFR: < 50,000 active series for the whole lab). Measured on first install:
# 43,860 series, 25,268 of them from the apiserver job; the two Freightline services were ~1,000.
# The histograms dropped below feed no kps rule or dashboard (grep of the 91.5.1 templates: 0 refs).
# metricRelabelings is a LIST, so setting it replaces the chart default: the first rule restates
# that default (thin out apiserver/etcd duration buckets), the second is ours.
kubeApiServer:
  serviceMonitor:
    metricRelabelings:
      - action: drop   # chart default, restated
        regex: (etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\.15|0\.2|0\.3|0\.35|0\.4|0\.45|0\.6|0\.7|0\.8|0\.9|1\.25|1\.5|1\.75|2|3|3\.5|4|4\.5|6|7|8|9|15|20|40|45|50)(\.0)?
        sourceLabels: [__name__, le]
      - action: drop   # lab addition: unused high-cardinality histograms
        regex: (apiserver_request_body_size_bytes|etcd_request_duration_seconds|apiserver_watch_list_duration_seconds|apiserver_response_sizes|apiserver_watch_cache_read_wait_seconds|apiserver_watch_events_sizes|apiserver_request_duration_seconds|apiserver_admission_controller_admission_duration_seconds)_bucket
        sourceLabels: [__name__]
