# TEMPORARY test fixture (M2/M3 gates), not part of the platform. A minimal Collector at the
# contract address otel-gateway.observability:4317 with the spec's M4 gateway exporters:
# otlp_grpc/tempo, otlp_http/prometheus, otlp_http/loki (each with sending_queue.batch).
# No processors (the real gateway adds memory_limiter, k8s_attributes, resource in M4).
# OTLP/HTTP :4318 is open so a test can post a log record the way the M4 agent will.
# Delete before M4 installs the real gateway:
#   kubectl delete -f tests/fixtures/otel-bridge-gateway.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-bridge-gateway
  namespace: observability
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }
    exporters:
      otlp_grpc/tempo: { endpoint: "tempo.monitoring:4317", tls: { insecure: true }, sending_queue: { batch: {} } }
      otlp_http/prometheus: { endpoint: "http://kps-prometheus.monitoring:9090/api/v1/otlp", sending_queue: { batch: {} } }
      otlp_http/loki: { endpoint: "http://loki.monitoring:3100/otlp", sending_queue: { batch: {} } }
    service:
      pipelines:
        traces: { receivers: [otlp], exporters: [otlp_grpc/tempo] }
        metrics: { receivers: [otlp], exporters: [otlp_http/prometheus] }
        logs: { receivers: [otlp], exporters: [otlp_http/loki] }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-bridge-gateway
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: otel-bridge-gateway }
  template:
    metadata:
      labels: { app.kubernetes.io/name: otel-bridge-gateway }
    spec:
      containers:
        - name: otelcol
          image: otel/opentelemetry-collector-contrib:0.161.0
          imagePullPolicy: IfNotPresent
          args: ["--config=/conf/config.yaml"]
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
          resources:
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: conf, mountPath: /conf }
      volumes:
        - name: conf
          configMap: { name: otel-bridge-gateway }
---
apiVersion: v1
kind: Service
metadata:
  name: otel-gateway   # the P02/P04 contract address
  namespace: observability
spec:
  selector: { app.kubernetes.io/name: otel-bridge-gateway }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
