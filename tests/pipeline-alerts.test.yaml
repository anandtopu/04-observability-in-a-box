# promtool unit tests for deploy/observability/pipeline-alerts.yaml (spec section 7: rules are tested).
# Run (the rule group is extracted from the PrometheusRule first):
#   bash tests/promtool-rules.sh
rule_files: [pipeline-alerts.rules.yaml]
evaluation_interval: 1m
tests:
  - name: healthy pipeline raises nothing
    interval: 1m
    input_series:
      - series: 'otelcol_exporter_send_failed_log_records{exporter="otlp_http/loki"}'
        values: '0+0x30'
      - series: 'otelcol_exporter_queue_size{exporter="otlp_http/loki"}'
        values: '10x30'
      - series: 'otelcol_exporter_queue_capacity{exporter="otlp_http/loki"}'
        values: '1000x30'
      - series: 'otelcol_receiver_refused_spans{receiver="otlp"}'
        values: '0x30'
      - series: 'target_info{job="freightline/orders"}'
        values: '1x30'
    alert_rule_test:
      - { eval_time: 30m, alertname: TelemetryExportFailing, exp_alerts: [] }
      - { eval_time: 30m, alertname: TelemetryQueueFilling, exp_alerts: [] }
      - { eval_time: 30m, alertname: TelemetryRefused, exp_alerts: [] }
      - { eval_time: 30m, alertname: OrdersMetricsAbsent, exp_alerts: [] }

  - name: Loki exporter failing for 10+ minutes raises a ticket (not before)
    interval: 1m
    input_series:
      - series: 'otelcol_exporter_send_failed_log_records{exporter="otlp_http/loki"}'
        values: '0+5x30'
    alert_rule_test:
      - { eval_time: 10m, alertname: TelemetryExportFailing, exp_alerts: [] }
      - eval_time: 20m
        alertname: TelemetryExportFailing
        exp_alerts:
          - exp_labels: { severity: ticket, service: otel-gateway, exporter: otlp_http/loki }
            exp_annotations:
              summary: "Exporter otlp_http/loki is failing to send telemetry"
              runbook_url: docs/runbooks/queue-filling.md

  - name: queue above 80% for 10 minutes pages
    interval: 1m
    input_series:
      - series: 'otelcol_exporter_queue_size{exporter="otlp_http/loki"}'
        values: '900x30'
      - series: 'otelcol_exporter_queue_capacity{exporter="otlp_http/loki"}'
        values: '1000x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: TelemetryQueueFilling
        exp_alerts:
          - exp_labels: { severity: page, service: otel-gateway, exporter: otlp_http/loki }
            exp_annotations:
              summary: "Sending queue of otlp_http/loki is 90% full"
              runbook_url: docs/runbooks/queue-filling.md

  - name: memory_limiter refusing spans raises a ticket
    interval: 1m
    input_series:
      - series: 'otelcol_receiver_refused_spans{receiver="otlp"}'
        values: '0+100x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: TelemetryRefused
        exp_alerts:
          - exp_labels: { severity: ticket, service: otel-gateway, receiver: otlp }
            exp_annotations:
              summary: "Receiver otlp is refusing data (memory_limiter pushback?)"

  - name: a freshly restarted, idle orders pod (no request series yet) does NOT page
    interval: 1m
    input_series:
      - series: 'target_info{job="freightline/orders",instance="new-pod-uid"}'
        values: '1x30'           # the SDK exports target_info every 15 s even with zero requests
    alert_rule_test:
      - { eval_time: 25m, alertname: OrdersMetricsAbsent, exp_alerts: [] }

  - name: orders telemetry stops arriving -> page after 10 minutes
    interval: 1m
    input_series:
      - series: 'target_info{job="freightline/orders"}'
        values: '1x5 _x30'       # 6 samples, then nothing
    alert_rule_test:
      - { eval_time: 10m, alertname: OrdersMetricsAbsent, exp_alerts: [] }
      - eval_time: 20m
        alertname: OrdersMetricsAbsent
        exp_alerts:
          - exp_labels: { severity: page, service: orders, job: freightline/orders }
            exp_annotations:
              summary: "No orders metrics for 10 minutes (app, agent or gateway not delivering)"
              runbook_url: docs/runbooks/slo-burn.md

  - name: the spec's *_total names match nothing (why D-20 exists)
    interval: 1m
    input_series:
      - series: 'otelcol_exporter_send_failed_log_records_total{exporter="otlp_http/loki"}'
        values: '0+5x30'
    alert_rule_test:
      - { eval_time: 20m, alertname: TelemetryExportFailing, exp_alerts: [] }
