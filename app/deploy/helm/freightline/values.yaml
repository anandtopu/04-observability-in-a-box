# Defaults for the P04-lite Freightline umbrella chart. Environment overlays live in
# app/deploy/envs/<env>/values.yaml.
global:
  environment: dev                                     # -> deployment.environment.name
  otlpEndpoint: http://otel-gateway.observability:4317 # the P02/P04 contract (FR-1)
  traceSampleRatio: "1.0"                              # lab; 0.1 at 100 req/s sustained

# Rendered by the freightline-service library chart, one entry per service.
# A map, not a list: Helm merges maps but replaces lists, so an overlay or
# `--set services.inventory.env.DB_POOL_MAX=2` changes one service without restating the rest.
services:
  orders:
    image: { repository: freightline/orders, tag: "0.2.3" }
    replicas: 1
    resources: { cpu: 100m, memory: 128Mi }
    env:
      INVENTORY_URL: http://inventory:8080
      FAULT_5XX_RATE: "0"            # P03's fault hook; M6 burn tests raise it
  inventory:
    image: { repository: freightline/inventory, tag: "0.2.3" }
    replicas: 1
    resources: { cpu: 100m, memory: 256Mi }
    env:
      DB_POOL_MAX: "10"              # M8's game day shrinks this to 2
      DB_POOL_TIMEOUT_SECONDS: "2"

postgres:
  image: ghcr.io/cloudnative-pg/postgresql:18
  storage: 2Gi
  maxConnections: 100
  sharedBuffers: 128MB
  resources: { cpu: 100m, memory: 512Mi }

mailpit:
  image: ghcr.io/axllent/mailpit:v1.31
