{{- /*
Database credentials. Passwords are generated on first install and then read back with
`lookup`, so upgrades keep them (Postgres only reads them at initdb). `helm template` has no
cluster, so it renders fresh random values; that is fine for linting and dry runs.
Nothing here is a real credential, and nothing is committed to Git.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "postgres-credentials" }}
{{- $pw := dict }}
{{- $users := list "postgres" }}
{{- range $name, $_ := .Values.services }}{{ $users = append $users $name }}{{ end }}
{{- range $u := $users }}
  {{- if and $existing (hasKey $existing.data $u) }}
    {{- $_ := set $pw $u (index $existing.data $u | b64dec) }}
  {{- else }}
    {{- $_ := set $pw $u (randAlphaNum 24) }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: freightline }
type: Opaque
data:
  {{- range $u := $users }}
  {{ $u }}: {{ index $pw $u | b64enc | quote }}
  {{- end }}
{{- range $name, $_ := .Values.services }}
---
# Each service gets its own database and role on the shared Postgres (P04-lite: one instance).
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-db
  labels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: freightline }
type: Opaque
stringData:
  DATABASE_URL: "postgresql://{{ $name }}:{{ index $pw $name }}@postgres:5432/{{ $name }}?sslmode=disable"
{{- end }}
